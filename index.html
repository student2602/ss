<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <form class="form">
        <button class="form__section-button"></button>
        <h3 class="form__section-title">Модель</h3>
        <input type="text" class="form__input" placeholder="Введите модель шины">
        <div class="form__checkbox-wrapper">
            <div class="form__element">
                <input type="checkbox" id="check1" class="form__checkbox visually-hidden">
                <label for="check1" class="form__label">
                    <span class="form__styled-checkbox"></span>ALINA</label>
            </div>
            <div class="form__element">
                <input type="checkbox" id="check2" class="form__checkbox visually-hidden">
                <label for="check2" class="form__label"> <span class="form__styled-checkbox"></span>BLIWWAS</label>
            </div>
            <div class="form__element">
                <input type="checkbox" id="check3" class="form__checkbox visually-hidden">
                <label for="check3" class="form__label"> <span class="form__styled-checkbox"></span>FORCE Moode</label>
            </div>
            <div class="form__element">
                <input type="checkbox" id="check4" class="form__checkbox visually-hidden">
                <label for="check4" class="form__label"> <span class="form__styled-checkbox"></span>ICE Gide</label>
            </div>
        </div>
        <h4 class="form__title">Технология</h4>
        <div class="form__checkbox-wrapper">
            <div class="form__element">
                <input type="radio" id="radio1" name="radio" class="form__checkbox visually-hidden">
                <label for="radio1" class="form__label"><span class="form__styled-checkbox"></span>
                    Да</label>
            </div>
            <div class="form__element">
                <input type="radio" id="radio2" name="radio" class="form__checkbox visually-hidden">
                <label for="radio2" class="form__label"><span class="form__styled-checkbox"></span>Нет</label>
            </div>
        </div>
        <h4 class="form__title">Акции</h4>
        <div class="form__checkbox-wrapper">
            <div class="form__styled-element">
            <input type="checkbox" id="styled1" class="form__styled-input visually-hidden">
            <label class="form__styled-label" for="styled1">
                <span class="form__clone-label">SALE</span>SALE</label>
        </div>
        <div class="form__styled-element">
            <input type="checkbox" id="styled2" class="form__styled-input visually-hidden">
            <label class="form__styled-label" for="styled2">
                <span class="form__clone-label">NEW</span>NEW</label>
        </div>
        <div class="form__styled-element">
            <input type="checkbox" id="styled3" class="form__styled-input visually-hidden">
            <label class="form__styled-label" for="styled3">
                <span class="form__clone-label">HIT</span>HIT</label>
        </div>
        <div class="form__styled-element">
            <input type="checkbox" id="styled4" class="form__styled-input visually-hidden">
            <label class="form__styled-label" for="styled4">
                <span class="form__clone-label">ПОДАРОК</span>ПОДАРОК</label>
        </div>
        </div>
    </form>
</body>

</html>
